[project]
name = "paperatlas"
version = "0.1.0"
description = "Concept-centric research paper recommendation system"
requires-python = ">=3.11"

dependencies = [
  "torch",
  "transformers",
  "sentence-transformers",
  "faiss-cpu",
  "numpy",
  "scipy",
  "pandas",
  "scikit-learn",
  "pydantic>=2.0",
  "pyyaml",
  "fastapi",
  "uvicorn",
  "httpx",
  "pymupdf",
  "sqlalchemy>=2.0",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "alembic>=1.13",
  "python-dotenv>=1.0",
  "jinja2>=3.1",
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=3.0"
]

[project.scripts]
paperatlas = "paperatlas.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paperatlas = ["config/*.yaml", "db/migrations/*.py", "db/migrations/*.mako", "db/migrations/versions/*.py", "lab/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["src/paperatlas"]
markers = ["db: requires a local PostgreSQL test database (PAPERATLAS_TEST_DATABASE_URL)"]

[tool.uv]
dev-dependencies = [
  "pytest",
  "black",
  "ruff",
  "ipykernel"
]
